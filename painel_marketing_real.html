<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketing · leads e vendas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#061015;--card:#0d1b22;--card2:#10232c;--t1:#ffffff;--t2:#a7b8c3;--t3:#62737e;--g:#5cc610;--b:#3ba7ff;--r:#ff5a5a;--a:#ffc233;--v:#b38cff;--trk:#1a2c35}
html,body{margin:0;width:100%;height:100%;background:#061015!important;overflow:hidden;font-family:Inter,sans-serif!important;color:#fff;font-variant-numeric:tabular-nums}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:radial-gradient(1400px 700px at 15% 0%,#0b2029 0%,var(--bg) 60%)}
.tela{position:absolute;inset:0;padding:22px 40px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.hidden{display:none}
.topo{display:flex;justify-content:space-between;align-items:center;height:64px}
.mes{font-size:56px;font-weight:900;letter-spacing:-1px;white-space:nowrap}.mes i{font-style:normal;color:var(--g)}
.chip{font-size:40px;font-weight:800;color:var(--t2);background:var(--card);border-radius:999px;padding:6px 26px}.chip b{color:#fff}
.g{color:var(--g)}.r{color:var(--r)}.a{color:var(--a)}.bl{color:var(--b)}.vi{color:var(--v)}.z{color:var(--t3)}
.card{background:var(--card);border-radius:24px;padding:12px 24px;box-sizing:border-box}
.lbl{font-size:40px;font-weight:800;color:var(--t2);white-space:nowrap}
/* tiles */
.tiles{display:grid;grid-template-columns:1.3fr 1.3fr .75fr 1.15fr;gap:14px;height:286px}
.hero{display:flex;align-items:baseline;gap:16px;margin:2px 0 8px}
.hero .n{font-size:74px;font-weight:900;line-height:1;letter-spacing:-1px;white-space:nowrap}
.pill{font-size:40px;font-weight:900;border-radius:999px;padding:2px 16px;white-space:nowrap}
.pill.up{background:rgba(92,198,16,.16);color:var(--g)}.pill.dn{background:rgba(255,90,90,.16);color:var(--r)}
.bar{height:20px;border-radius:10px;background:var(--trk);overflow:hidden;margin:6px 0 6px}
.bar i{display:block;height:100%;border-radius:10px}
.bar{position:relative}.bar .rt{position:absolute;top:-6px;bottom:-6px;width:5px;margin-left:-2px;background:#fff;border-radius:3px;box-shadow:0 0 0 2px #061015}
.bar.fina{height:10px}
.lin{display:flex;justify-content:space-between;gap:12px;font-size:40px;font-weight:800;color:var(--t2);white-space:nowrap;line-height:1.15}
.lin b{color:#fff}
/* mês a mês */
table.mm{width:100%;border-collapse:separate;border-spacing:8px 3px;margin:-3px -8px}
.mm th{font-size:40px;font-weight:800;color:var(--t3);text-align:right;padding:0 12px;line-height:1.05}
.mm th:first-child{text-align:left}
.mm td{font-size:40px;font-weight:900;text-align:right;padding:0 12px;line-height:1.05;white-space:nowrap;border-radius:10px;position:relative}
.mm td:first-child{text-align:left;color:var(--t2);font-weight:800}
.mm th.cur{color:var(--g)}
.mm td.db{background:linear-gradient(90deg,var(--c) var(--w),transparent var(--w))}
/* baixo */
.baixo{display:grid;grid-template-columns:1fr 540px;grid-template-rows:minmax(0,1fr);gap:14px;flex:1;min-height:0}.baixo>.card{min-height:0;overflow:hidden}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.sec .tt{font-size:42px;font-weight:900}
.leg{font-size:40px;font-weight:800;color:var(--t2)}.leg i{display:inline-block;width:26px;height:26px;border-radius:6px;margin:0 10px 0 22px;vertical-align:-2px}
.chart{display:grid;grid-template-columns:repeat(31,minmax(0,1fr));grid-template-rows:100%;gap:5px;height:calc(100% - 64px)}
.col{display:flex;flex-direction:column;align-items:center;height:100%}
.bars{position:relative;width:86%;flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;margin-top:44px}
.gs{position:absolute;bottom:0;left:0;right:0;background:#22343e;border-radius:6px 6px 0 0}
.bb{position:relative;width:62%;background:var(--b);border-radius:6px 6px 0 0}
.vv{position:absolute;left:50%;transform:translateX(-50%);font-size:40px;font-weight:900;line-height:1}
.dt{font-size:40px;font-weight:800;color:var(--t3);height:44px;white-space:nowrap;margin-top:4px}
.col.hj .bb{background:var(--g)}.col.hj .vv,.col.hj .dt{color:var(--g)}
.tema{display:grid;grid-template-columns:1fr auto;align-items:center;margin-top:4px;line-height:1.1}.tema .bar{height:12px;margin:4px 0 2px}
.tema .nm{font-size:40px;font-weight:800;color:var(--t2)}.tema .vl{font-size:40px;font-weight:900}
.tema .ref{grid-column:1/3;font-size:40px;font-weight:700;color:var(--t3)}
/* tela 2 */
.ya{background:linear-gradient(90deg,#0d2a3a,#0d1b22);border-radius:26px;padding:14px 30px;display:flex;align-items:center;gap:34px;height:150px;box-sizing:border-box;box-shadow:inset 6px 0 0 var(--b)}
.ft{width:104px;height:104px;border-radius:50%;object-fit:cover;background:#1a2c35;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:var(--t2);flex:none}
.ya .nm{font-size:50px;font-weight:900;line-height:1.05}.ya .pp{font-size:40px;font-weight:800;color:var(--b);white-space:nowrap}
.ya .st{display:flex;flex-direction:column;align-items:center;flex:1}
.ya .st b{font-size:70px;font-weight:900;line-height:1}.ya .st span{font-size:40px;font-weight:800;color:var(--t2);white-space:nowrap}
.rk{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:14px;min-height:0}
.cd{background:var(--card);border-radius:22px;padding:6px 22px;display:grid;grid-template-columns:62px 88px minmax(0,1fr) auto;grid-template-rows:repeat(3,1fr);grid-template-areas:'pos ft nm sts' 'pos ft cv sts' 'pos ft tm tm';column-gap:18px;align-items:center;min-height:0}
.cd .pos{grid-area:pos;font-size:48px;font-weight:900;color:var(--t3);text-align:center}
.cd.top .pos{color:var(--g)}
.cd .ft{grid-area:ft;width:88px;height:88px;font-size:40px}
.cd .nm{grid-area:nm}.cd .cvb{grid-area:cv;min-width:0}.cd .tm3{grid-area:tm}
.cd .nm{font-size:44px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.cd .cvb{display:flex;align-items:center;gap:14px}
.cd .cvb .bar{flex:1;height:16px;margin:0}
.cd .cvb span{font-size:40px;font-weight:800;color:var(--t2);white-space:nowrap}.cd .cvb b{color:#fff}
.cd .tm3{font-size:40px;font-weight:700;color:var(--t3);white-space:nowrap;line-height:1.15}.cd .tm3 b{color:var(--t2)}
.cd .sts{grid-area:sts;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.cd .sts .pill{font-size:40px;line-height:1.1;padding:0 14px}
.pill.neu{background:#1a2c35;color:var(--t2)}.pill.neu b{color:#fff}
.pill.rd{background:rgba(255,90,90,.16);color:var(--r)}
.seg{font-size:40px;font-weight:800;color:var(--t3);text-align:right;height:44px;line-height:44px;white-space:nowrap}.seg b{color:var(--t2)}
@keyframes pisca{0%,100%{box-shadow:inset 0 0 0 0 rgba(92,198,16,0)}50%{box-shadow:inset 0 0 0 6px rgba(92,198,16,.95);background:#14361a}}
.pisca{animation:pisca 1s ease-in-out infinite}
#toast{position:absolute;left:50%;top:26px;transform:translate(-50%,-30px);opacity:0;transition:opacity .4s,transform .4s;z-index:50;background:linear-gradient(135deg,#16331f,#1f5a2e);color:#9dff6a;font-size:52px;font-weight:900;padding:18px 40px;border-radius:24px;white-space:nowrap;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#flash{position:fixed;inset:0;z-index:9000;pointer-events:none;opacity:0}
#flash.venda{animation:clarao 4.5s linear}
#flash.lead{animation:claraoLead 1.6s linear}
@keyframes clarao{0%{opacity:0;background:#fff}4%{opacity:1;background:#fff}10%{opacity:.15;background:#5cc610}16%{opacity:1;background:#5cc610}22%{opacity:.1;background:#fff}28%{opacity:1;background:#fff}34%{opacity:.15;background:#ffd400}40%{opacity:1;background:#ffd400}48%{opacity:.1;background:#5cc610}55%{opacity:.95;background:#5cc610}65%{opacity:.2;background:#fff}72%{opacity:.8;background:#fff}100%{opacity:0;background:#5cc610}}
@keyframes claraoLead{0%{opacity:0;background:#3ba7ff}10%{opacity:.85;background:#3ba7ff}25%{opacity:.1}40%{opacity:.75;background:#3ba7ff}100%{opacity:0}}
.conf{position:fixed;top:-40px;z-index:9001;pointer-events:none;width:22px;height:34px;border-radius:4px;animation:cai linear forwards}
@keyframes cai{to{transform:translateY(115vh) rotate(900deg)}}
#toast.venda{background:linear-gradient(135deg,#3a2a00,#7a5a00);color:#ffe066;font-size:64px}
#toast.on{opacity:1;transform:translate(-50%,0)}
#somlock{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:50;background:#1a2c35;color:var(--t2);font-size:40px;font-weight:800;padding:6px 26px;border-radius:999px;display:none}
.erro{position:absolute;right:52px;bottom:8px;font-size:40px;font-weight:800;color:var(--r)}
</style></head><body>
<div id="stage">
<section class="tela" id="t1">
  <div class="topo"><div class="mes" id="mes1"></div><div class="seg" id="seg"></div></div>
  <div class="tiles">
    <div class="card" id="vAG"></div>
    <div class="card" id="vAU"></div>
    <div class="card" id="kL"></div>
    <div class="card" id="kP"></div>
  </div>
  <div class="card"><table class="mm" id="mm"></table></div>
  <div class="baixo">
    <div class="card"><div class="sec"><span class="tt">Leads por dia</span><span class="leg"><i style="background:var(--b)"></i><span id="lg1"></span><i style="background:#22343e"></i><span id="lg2"></span></span></div><div class="chart" id="ch"></div></div>
    <div class="card"><div class="sec"><span class="tt">Por tema</span><span class="lbl" id="tmr"></span></div><div id="tm"></div></div>
  </div>
</section>
<section class="tela hidden" id="t2">
  <div class="topo"><div class="mes">Leads por consultor</div><div class="chip" id="inf2"></div></div>
  <div class="ya" id="ya"></div>
  <div class="rk" id="rk"></div>
</section>
<div class="erro" id="erro"></div>
<div id="toast"></div>
<div id="somlock">aperte OK no controle para ligar o som</div>
</div>
<script>
const QS=new URLSearchParams(location.search);
const NOMES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const CURTO=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const cap=s=>s[0].toUpperCase()+s.slice(1);
function hojeBR(){return new Date(Date.now()-3*3600e3)}
const H=hojeBR(), ANO=H.getUTCFullYear(), MES=H.getUTCMonth()+1, DIA=H.getUTCDate();
const ym=(y,m)=>`${y}-${String(m).padStart(2,'0')}`;
const MES_ATUAL=ym(ANO,MES);
const PM=MES===1?{y:ANO-1,m:12}:{y:ANO,m:MES-1};
const MES_ANT=ym(PM.y,PM.m);
const dmes=d=>String(d).slice(0,7), ddia=d=>+String(d).slice(8,10);
const N=v=>Math.round(v).toLocaleString('pt-BR');
function R(v){v=+v||0;const a=Math.abs(v);if(a>=1e6)return 'R$ '+(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi';if(a>=1e3)return 'R$ '+(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:a>=1e5?0:1})+' mil';return 'R$ '+N(v)}
const pct=(a,b)=>b?a/b*100:0;
const P=v=>(Math.round(v*10)/10).toLocaleString('pt-BR')+'%';
function varia(a,b){if(!b)return '';const p=Math.round((a-b)/b*100);const c=p>=0?'g':'r';return ` <span class="${c}">${p>=0?'+':''}${p}%</span>`}
function corAting(p){return p>=100?'g':p>=80?'a':'r'}
const sum=(arr,f)=>arr.reduce((s,x)=>s+(+f(x)||0),0);
// margem de segurança: TV costuma cortar as bordas (overscan); ?margem=0 desliga
const MARGEM=QS.has('margem')?(+QS.get('margem')||0)/100:0.04;
// a TV Android (05/10) informa viewport 1088x612 mas tela 962x541: usa o menor dos dois pra não cortar
function tela_wh(){const v=window.visualViewport;let W=v?v.width:document.documentElement.clientWidth||innerWidth,H0=v?v.height:document.documentElement.clientHeight||innerHeight;
  if(screen&&screen.width&&screen.height&&screen.width<W*0.98){W=Math.min(W,screen.width);H0=Math.min(H0,screen.height)}return [W,H0]}
function fit(){const [W,H0]=tela_wh();const s=Math.min(W*(1-2*MARGEM)/1920,H0*(1-2*MARGEM)/1080);const innerWidth=W,innerHeight=H0;const st=document.getElementById('stage');st.style.transform=`scale(${s})`;st.style.left=((innerWidth-1920*s)/2)+'px';st.style.top=((innerHeight-1080*s)/2)+'px'}
addEventListener('resize',fit);fit();
try{const [W,H0]=tela_wh();new Image().src=`d/tela.gif?w=${W}&h=${H0}&iw=${window.innerWidth}&ih=${window.innerHeight}&sw=${screen.width}&sh=${screen.height}&dpr=${window.devicePixelRatio}`}catch(e){}
const ini6=ym(MES<=6?ANO-1:ANO,((MES+5)%12)+1)+'-01';

async function contaBase(){
  const r=await fetch(SUPABASE_URL+'/rest/v1/vw_tv_leads?select=id',{method:'HEAD',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,Prefer:'count=exact',Range:'0-0'}});
  return +((r.headers.get('content-range')||'').split('/')[1]||0);
}


// sem login, igual ao painel antigo: os dados vêm de d/painel.json, gerado a cada 5 min na robusta (~/scripts/tv_marketing/gerar_json.py)
let DADOS=null;
const MAPA={vw_plan_vs_real_vertical:'plan',vw_tvm_leads_dia:'leads_dia',vw_tvm_gasto_dia:'gasto_dia',vw_tvm_vendas_lead:'vendas_lead',vw_tvm_coorte:'coorte',vw_tvm_consultores:'consultores',vw_tvm_yasmim:'yasmim'};
async function carregaDados(){const r=await fetch(`d/painel.json?_=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error('dados '+r.status);DADOS=await r.json();}
function sbFetch(v){return Promise.resolve((DADOS&&DADOS[MAPA[v]])||[])}
async function contaBase(){return DADOS&&DADOS.base&&DADOS.base[0]?DADOS.base[0].n:null}
// ritmo: dias úteis (seg a sex) já corridos no mês, contando hoje
function diasUteis(y,m,ate){let n=0;const fim=new Date(Date.UTC(y,m,0)).getUTCDate();for(let d=1;d<=Math.min(ate,fim);d++){const w=new Date(Date.UTC(y,m-1,d)).getUTCDay();if(w>0&&w<6)n++}return n}
const RITMO=diasUteis(ANO,MES,DIA)/Math.max(1,diasUteis(ANO,MES,31));
const corRitmo=(real,alvo)=>!alvo?'var(--t2)':real>=alvo?'var(--g)':real>=alvo*0.8?'var(--a)':'var(--r)';
const corAt=p=>p>=100?'var(--g)':p>=80?'var(--a)':'var(--r)';
const pill=(a,b)=>{if(!b)return '';const p=Math.round((a-b)/b*100);return `<span class="pill ${p>=0?'up':'dn'}">${p>=0?'▲':'▼'} ${Math.abs(p)}%</span>`};
async function tela1(){
  const [plan,ld,gd,vl,co,base]=await Promise.all([
    sbFetch('vw_plan_vs_real_vertical',`select=vertical,mes,id_tempo,meta,realizado&id_tempo=like.${ANO}*&vertical=in.(AGRO,AGUA)`),
    sbFetch('vw_tvm_leads_dia',`select=dia,vertical,tema,n&dia=gte.${ini6}`),
    sbFetch('vw_tvm_gasto_dia',`select=dia,vertical,gasto&dia=gte.${ini6}`),
    sbFetch('vw_tvm_vendas_lead',`select=dia,vertical,lead_id,valor&dia=gte.${ini6}`),
    sbFetch('vw_tvm_coorte','select=mes,vertical,leads,convertidos'),
    contaBase().catch(()=>null)]);
  const sf=a=>a.filter(r=>r.vertical!=='FLORESTAS');
  const ldA=sf(ld),gdA=sf(gd),vlA=sf(vl),coA=sf(co);
  const SM=CURTO[PM.m-1];
  document.getElementById('mes1').innerHTML=`${cap(NOMES[MES-1])} <i>${ANO}</i>`;
  const gm=sum(gdA.filter(r=>dmes(r.dia)===MES_ATUAL),r=>r.gasto), ga=sum(gdA.filter(r=>dmes(r.dia)===MES_ANT),r=>r.gasto);

  // vendas x META
  const tileV=(v,nome)=>{const m=plan.filter(r=>r.vertical===v&&+r.mes===MES), a=plan.filter(r=>r.vertical===v&&+r.mes<=MES);
    const rm=sum(m,r=>r.realizado),mm=sum(m,r=>r.meta),ra=sum(a,r=>r.realizado),ma=sum(a,r=>r.meta),pm=pct(rm,mm),pa=pct(ra,ma);
    // marca branca na barra = quanto da META já devia ter entrado até hoje; a cor segue essa marca
    const am=mm*RITMO, aa=sum(plan.filter(r=>r.vertical===v&&+r.mes<MES),r=>r.meta)+am;
    const cm=corRitmo(rm,am), ca=corRitmo(ra,aa);
    // META do mês batida: comemora uma vez por mês e vertical
    if(pm>=100){const kf=`tvmkt_meta_${MES_ATUAL}_${v}`;let ja=null;try{ja=localStorage.getItem(kf)}catch(e){}
      if(!ja){try{localStorage.setItem(kf,'1')}catch(e){};setTimeout(()=>{som('venda');setTimeout(()=>som('venda'),2600);clarao('venda');
        const ta=document.getElementById('toast');ta.classList.add('venda');aviso(`META de ${NOMES[MES-1]} batida no ${nome}!`);setTimeout(()=>ta.classList.remove('venda'),9500)},1500)}}
    return `<div class="lbl">Vendas ${nome}</div><div class="hero"><span class="n" style="color:${cm}">${R(rm)}</span></div>
      <div class="bar"><i style="width:${Math.min(100,pm)}%;background:${cm}"></i><span class="rt" style="left:${Math.min(100,100*am/Math.max(1,mm))}%"></span></div>
      <div class="lin"><span>META <b>${R(mm)}</b></span><b style="color:${cm}">${Math.round(pm)}%</b></div>
      <div class="bar fina"><i style="width:${Math.min(100,pa)}%;background:${ca}"></i><span class="rt" style="left:${Math.min(100,100*aa/Math.max(1,ma))}%"></span></div>
      <div class="lin"><span>até ${CURTO[MES-1]} <b>${R(ra)}</b></span><b style="color:${ca}">${Math.round(pa)}%</b></div>`};
  const sg=(DADOS&&DADOS.seguidores)||[];const sgl=v=>{const x=sg.find(r=>r.vertical===v);if(!x)return '';const d=x.fim_mes_ant!=null?x.atual-x.fim_mes_ant:null;return `${v==='agro'?' ':' · '}${({agro:'Agro',agua:'Água',florestas:'Florestas'})[v]} <b>${N(x.atual)}</b>`+(d!=null?` <span class="${d>=0?'g':'r'}">${d>=0?'▲':'▼'}${N(Math.abs(d))}</span>`:'')};
  document.getElementById('seg').innerHTML='Seguidores'+sgl('agro')+sgl('agua')+sgl('florestas');
  document.getElementById('vAG').innerHTML=tileV('AGRO','Agro');
  document.getElementById('vAU').innerHTML=tileV('AGUA','Água');
  // leads e pedidos
  const lm=ldA.filter(r=>dmes(r.dia)===MES_ATUAL), lpa=ldA.filter(r=>dmes(r.dia)===MES_ANT&&ddia(r.dia)<=DIA), la=ldA.filter(r=>dmes(r.dia)===MES_ANT);
  const nlm=sum(lm,r=>r.n), nlp=sum(lpa,r=>r.n);
  const lv=v=>sum(lm.filter(r=>r.vertical===v),r=>r.n), lvp=v=>sum(lpa.filter(r=>r.vertical===v),r=>r.n);
  document.getElementById('kL').innerHTML=`<div class="lbl">Leads no mês</div><div class="hero"><span class="n">${N(nlm)}</span>${pill(nlm,nlp)}</div>
    <div class="lin"><span>${SM} 1 a ${DIA}</span><b>${N(nlp)}</b></div>
    <div class="lin"><span>Agro</span><span><b>${N(lv('AGRO'))}</b><span class="z">/${N(lvp('AGRO'))}</span></span></div><div class="lin"><span>Água</span><span><b>${N(lv('AGUA'))}</b><span class="z">/${N(lvp('AGUA'))}</span></span></div>`;
  const vm=vlA.filter(r=>dmes(r.dia)===MES_ATUAL), vpa=vlA.filter(r=>dmes(r.dia)===MES_ANT&&ddia(r.dia)<=DIA);
  const rm=sum(vm,r=>r.valor), rp=sum(vpa,r=>r.valor);
  const cm=coA.filter(r=>r.mes===MES_ATUAL), ca=coA.filter(r=>r.mes===MES_ANT);
  const pm=pct(sum(cm,r=>r.convertidos),sum(cm,r=>r.leads)), pa=pct(sum(ca,r=>r.convertidos),sum(ca,r=>r.leads));
  document.getElementById('kP').innerHTML=`<div class="lbl">Pedidos de leads</div><div class="hero"><span class="n g">${R(rm)}</span>${pill(rm,rp)}</div>
    <div class="lin"><span>${SM} 1 a ${DIA}</span><b>${R(rp)}</b></div>

    ['AGRO','AGUA'].map(v=>`<tr><td>Vendas ${v==='AGRO'?'Agro':'Água'}</td>${ef.map(e=>{const r=plan.filter(x=>x.vertical===v&&+x.mes===e.x.m&&e.x.y===ANO);const re=sum(r,x=>x.realizado),me=sum(r,x=>x.meta),p=pct(re,me);
      const alvo=e.x.k===MES_ATUAL?me*RITMO:me;const c=corRitmo(re,alvo);return `<td style="color:${me?c:'var(--t3)'}">${me?Math.round(p)+'%':''}</td>`}).join('')}</tr>`).join('')+
    linha('Investimento','g',R,'rgba(59,167,255,.22)')+linha('Leads','l',N,'rgba(59,167,255,.22)')+linha('Pedidos de leads','rv',R,'rgba(92,198,16,.22)')+linha('Conversão','cv',P,'rgba(92,198,16,.22)');
  // por tema (mesmo período)
  const T=['Ulexita','Compostagem','Enxofre','Água','Outros'];
  const tv=T.map(t=>({t,a:sum(lm.filter(r=>r.tema===t),r=>r.n),b:sum(lpa.filter(r=>r.tema===t),r=>r.n)})).filter(x=>x.a||x.b);
  const tmx=Math.max(1,...tv.map(x=>Math.max(x.a,x.b)));
  document.getElementById('tmr').textContent=`${SM} 1 a ${DIA}`;
  document.getElementById('tm').innerHTML=tv.map(x=>`<div class="tema"><span class="nm">${x.t}</span><span class="vl">${N(x.a)} <span class="z">/ ${N(x.b)}</span></span>
    <div class="bar" style="grid-column:1/3;position:relative"><i style="position:absolute;inset:0 auto 0 0;width:${100*x.b/tmx}%;background:#22343e"></i><i style="position:absolute;inset:0 auto 0 0;width:${100*x.a/tmx}%;background:var(--b)"></i></div></div>`).join('');
  // leads por dia
  document.getElementById('lg1').textContent=NOMES[MES-1];document.getElementById('lg2').textContent=NOMES[PM.m-1];
  const porDia=a=>{const o={};a.forEach(r=>{o[ddia(r.dia)]=(o[ddia(r.dia)]||0)+(+r.n)});return o};
  const dA=porDia(lm),dP=porDia(la);const mx=Math.max(1,...Object.values(dA),...Object.values(dP));
  let h='';for(let d=1;d<=31;d++){const a=dA[d]||0,p=dP[d]||0,fut=d>DIA;const ha=fut?0:Math.round(100*a/mx),hp=Math.round(100*p/mx);const lab=(d===1||d%5===0||d===DIA)?d:'';

  document.getElementById('ch').innerHTML=h;
}

const curto=n=>{const p=(n||'').split(' ');return (p.join(' ').length<=11)?p.slice(0,2).join(' '):p[0]};
const PISCAR={};
let _ac=null;
function somLiberar(){try{if(!_ac)_ac=new (window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume()}catch(e){}
  const sl=document.getElementById('somlock');const ok=_ac&&_ac.state==='running';sl.style.display=ok?'none':'block';clearTimeout(sl._h);if(!ok)sl._h=setTimeout(()=>sl.style.display='none',20000)}
['click','keydown','touchstart','pointerdown'].forEach(ev=>addEventListener(ev,somLiberar));
function tom(ctx,f,t0,dur,tipo,vol,f2){const o=ctx.createOscillator(),g=ctx.createGain();o.type=tipo||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.3,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(ctx.destination);o.start(t0);o.stop(t0+dur+0.05)}
function ruido(ctx,t0,dur,vol){const n=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=ctx.createBufferSource(),g=ctx.createGain(),f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=3000;s.buffer=n;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(ctx.destination);s.start(t0)}
function som(tipo){somLiberar();if(!_ac||_ac.state!=='running')return;const c=_ac,t=c.currentTime+0.02;
  if(tipo==='lead'){ // moeda de videogame, duas vezes
    [0,0.32].forEach(d=>{tom(c,988,t+d,0.09,'square',0.18);tom(c,1319,t+d+0.08,0.35,'square',0.18)})}
  else if(tipo==='repasse'){tom(c,1319,t,0.5,'sine',0.3);tom(c,1047,t+0.28,0.8,'sine',0.3)}
  else if(tipo==='venda'){ // caixa registradora + fanfarra
    ruido(c,t,0.18,0.5);tom(c,2637,t+0.05,0.5,'triangle',0.25);tom(c,3136,t+0.12,0.6,'triangle',0.2);
    [[523,0.35],[659,0.5],[784,0.65],[1047,0.8]].forEach(([f,d])=>tom(c,f,t+d,0.22,'sawtooth',0.12));
    [523,659,784,1047].forEach(f=>tom(c,f,t+1.05,1.4,'triangle',0.16))}
  else if(tipo==='seguidor'){tom(c,600,t,0.14,'sine',0.25,1200)}}
function sino(vezes){somLiberar();if(!_ac||_ac.state!=='running')return;const ctx=_ac;
  for(let k=0;k<Math.min(vezes||1,3);k++){const t0=ctx.currentTime+k*0.24;
    [[784,1],[1568,0.5],[3136,0.22]].forEach(([f,a])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.3*a,t0+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t0+1.4);
      o.connect(g);g.connect(ctx.destination);o.start(t0);o.stop(t0+1.5)})}}
function clarao(tipo){const fl=document.getElementById('flash');fl.className='';void fl.offsetWidth;fl.className=tipo;
  if(tipo==='venda'){const cores=['#5cc610','#ffd400','#3ba7ff','#ff5a5a','#ffffff','#b38cff'];
    for(let i=0;i<160;i++){const c=document.createElement('div');c.className='conf';c.style.left=(Math.random()*100)+'vw';c.style.background=cores[i%cores.length];
      c.style.animationDuration=(2.5+Math.random()*2.5)+'s';c.style.animationDelay=(Math.random()*1.2)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),6500)}}}
function aviso(txt){const t=document.getElementById('toast');t.textContent=txt;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),9000)}
function eventos(){
  const ult=DADOS.ultimos||[],rep=DADOS.repasses||[];
  let vistos=null;try{vistos=JSON.parse(localStorage.getItem('tvmkt_vistos')||'null')}catch(e){}
  const chaves=ult.map(x=>'L'+x.id).concat(rep.map(x=>'R'+x.id+':'+x.responsavel));
  if(!vistos){try{localStorage.setItem('tvmkt_vistos',JSON.stringify(chaves))}catch(e){};return}
  const vs=new Set(vistos);
  const nl=ult.filter(x=>!vs.has('L'+x.id)), nr=rep.filter(x=>!vs.has('R'+x.id+':'+x.responsavel));
  try{localStorage.setItem('tvmkt_vistos',JSON.stringify(chaves.concat(vistos).slice(0,300)))}catch(e){}
  const vr=DADOS.vendas_recentes||[];
  let vv=null;try{vv=JSON.parse(localStorage.getItem('tvmkt_vendas')||'null')}catch(e){}
  const kv=vr.map(x=>'V'+x.id);
  try{localStorage.setItem('tvmkt_vendas',JSON.stringify(kv.concat(vv||[]).slice(0,200)))}catch(e){}
  const nv=vv?vr.filter(x=>!new Set(vv).has('V'+x.id)):[];
  // seguidores: toca um "pop" quando sobe
  const sg=DADOS.seguidores||[];let sa=null;try{sa=JSON.parse(localStorage.getItem('tvmkt_seg')||'null')}catch(e){}
  const tot=sg.reduce((s,x)=>s+(+x.atual||0),0);try{localStorage.setItem('tvmkt_seg',JSON.stringify(tot))}catch(e){}
  if(sa!=null&&tot>sa&&!nl.length&&!nr.length&&!nv.length){som('seguidor');aviso(`+${N(tot-sa)} seguidor${tot-sa>1?'es':''} no Instagram`)}
  if(nv.length){const x=nv[0];const ta=document.getElementById('toast');
    som('venda');setTimeout(()=>som('venda'),2600);
    clarao('venda');
    if(x.responsavel)PISCAR[curto(x.responsavel)]=Date.now()+120e3;
    ta.classList.add('venda');aviso(`VENDA de lead! ${R(x.total)} · ${x.tema}${x.responsavel?' · '+curto(x.responsavel):''}`);setTimeout(()=>ta.classList.remove('venda'),9500);
    if(!fixa)mostra(1,60e3);return}
  if(!nl.length&&!nr.length)return;
  const ate=Date.now()+90e3;
  nl.forEach(x=>PISCAR[x.responsavel==='Mesa'?'Mesa':curto(x.responsavel)]=ate);
  nr.forEach(x=>PISCAR[curto(x.responsavel)]=ate);
  som(nl.length?'lead':'repasse');if(nl.length)clarao('lead');
  if(nl.length){const x=nl[0];const onde=[x.cidade,x.uf].filter(Boolean).join('/');
    aviso((nl.length>1?nl.length+' leads novos':'Lead novo')+` · ${x.tema}${onde?' · '+onde:''} → ${x.responsavel==='Mesa'?'Mesa da Yasmim':curto(x.responsavel)}`)}
  else{aviso(`Lead passado → ${curto(nr[0].responsavel)}`)}
  if(!fixa)mostra(1,60e3);
}
async function carregar(){const e=document.getElementById('erro');let falha=[];

  e.textContent=falha.length?'sem atualizar: '+falha.join(', '):(idade>20?'dados de '+new Date(DADOS.gerado_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'');}
